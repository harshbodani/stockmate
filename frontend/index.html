<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockMate</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <img src="assets/logo.svg" alt="" width="34" height="34">
        <span>StockMate<small>Smart stock monitoring</small></span>
      </a>
      <nav id="nav" aria-label="Main"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <span class="grow"></span>
        <div class="userbox">
          <span id="userName"></span>
          <button class="btn small ghost" id="pwBtn" type="button">Change password</button>
          <button class="btn small" id="logoutBtn" type="button">Sign out</button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <section id="login" aria-label="Sign in">
    <form id="loginForm" class="login-card">
      <img src="assets/logo.svg" alt="" width="52" height="52">
      <h2>StockMate</h2>
      <p class="muted">Sign in to continue</p>
      <div class="field"><label for="loginUser">Username</label><input id="loginUser" autocomplete="username" required></div>
      <div class="field"><label for="loginPass">Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <p class="form-err" id="loginErr" role="alert"></p>
      <button class="btn primary big" type="submit">Sign in</button>
    </form>
  </section>
  <div id="toasts" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/pos.js"></script>
  <script>boot();</script>
</body>
</html>
